name: Site quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate SEO, AEO, schema, accessibility structure and links
        run: npm run audit

      - name: Prepare exact release directory
        run: npm run release

      - name: Ensure private repository files are not published
        run: |
          test ! -e dist/.github
          test ! -e dist/scripts
          test ! -e dist/audit
          test ! -e dist/SITE-AUDIT-2026-PREVIEW.md

      - name: Lighthouse publication checks
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
