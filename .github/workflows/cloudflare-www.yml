name: Configure www canonical redirect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/[[path]].js"
      - ".github/workflows/cloudflare-www.yml"

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Attach www to the Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}/domains"
          current=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${endpoint}")

          if jq -e '.result[] | select(.name == "www.thenitishkr.in")' <<<"${current}" >/dev/null; then
            echo "www.thenitishkr.in is already attached to the Pages project."
          else
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"www.thenitishkr.in"}' \
              "${endpoint}" | jq -e '.success == true' >/dev/null
            echo "Attached www.thenitishkr.in to the Pages project."
          fi

      - name: Wait for DNS and verify the canonical redirect
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 15 https://www.thenitishkr.in/ || true)
            location=$(curl --silent --head --max-time 15 https://www.thenitishkr.in/ \
              | awk 'BEGIN{IGNORECASE=1} /^location:/ {gsub("\r", ""); print $2}' || true)
            if [[ "${status}" == "301" && "${location}" == "https://thenitishkr.in/" ]]; then
              echo "Verified: www.thenitishkr.in redirects to https://thenitishkr.in/"
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${status:-unavailable}; waiting for DNS/TLS propagation."
            sleep 15
          done
          echo "The domain was attached, but DNS/TLS propagation is not complete yet."
          exit 1
