name: claude nkumar

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to do (e.g. audit, deploy, verify)'
        required: false
        default: 'audit'

permissions:
  contents: read

concurrency:
  group: claude-nkumar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate site
        run: npm run audit

      - name: Rebuild discovery signals
        run: npm run signals

      - name: Revalidate after signals
        run: npm run audit

      - name: Prepare release artifact
        run: npm run release

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}

      - name: Wait for custom domain propagation
        run: sleep 20

      - name: Verify live canonical URLs
        run: npm run verify:live

      - name: Submit to IndexNow
        run: npm run indexnow

      - name: Summary
        run: |
          {
            echo "## claude nkumar — manual run"
            echo ""
            echo "- Task input: \`${{ github.event.inputs.task }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Deployment: ${{ steps.deploy.outputs.deployment-url }}"
            echo "- Live site: https://thenitishkr.in/"
            echo "- Triggered by: ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
